<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverFocus - Cooldown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 420px;
            text-align: center;
        }

        .header {
            background-image: linear-gradient(to right, #850bb5, #1273e9);
            padding: 1.5rem;
        }

        .header h1 {
            color: #fff;
            font-size: 1.5rem;
            text-shadow: 1px 1px 2px #000;
        }

        .content {
            padding: 2rem;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .message {
            font-size: 1rem;
            color: #555;
            margin-bottom: 0.5rem;
        }

        .site-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 1.5rem;
            word-break: break-all;
        }

        .timer {
            font-size: 3rem;
            font-weight: 700;
            color: #4fbbbd;
            margin-bottom: 0.5rem;
        }

        .timer-label {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
        }

        button {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .proceed-btn {
            background-color: #4fbbbd;
            color: #fff;
        }

        .proceed-btn:hover:not(:disabled) {
            background-color: #3da8aa;
        }

        .proceed-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .back-btn {
            background-color: #e0e0e0;
            color: #333;
        }

        .back-btn:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>EverFocus</h1>
        </div>
        <div class="content">
            <div class="icon">&#9200;</div>
            <p class="message">You're about to visit a blocked site:</p>
            <p class="site-name" id="site-name"></p>
            <div class="timer" id="timer"></div>
            <p class="timer-label">seconds remaining</p>
            <div class="buttons">
                <button class="back-btn" id="back-btn">Go Back</button>
                <button class="proceed-btn" id="proceed-btn" disabled>Wait...</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/cooldown.ts"></script>
</body>
</html>
